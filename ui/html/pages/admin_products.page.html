{{define "main"}}
<div class="flex justify-between items-center">
    <h1 class="text-3xl font-bold">Products</h1>
    <a href="/admin/products/new" class="btn btn-primary">Add Product</a>
</div>

<div class="overflow-x-auto mt-8">
    <table class="table w-full">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
                <th>Stock</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {{range .Products}}
            <tr id="product-row-{{.ID}}">
                <td>{{.ID}}</td>
                <td>{{.Name}}</td>
                <td>{{formatPrice .Price}}</td>
                <td>{{.TotalStock}}</td>
                <td class="text-right">
                    <a
                        href="/admin/products/edit/{{.ID}}"
                        class="btn btn-ghost btn-sm"
                        >Edit</a
                    >
                    <button
                        class="btn btn-ghost btn-sm text-red-500"
                        hx-delete="/admin/products/{{.ID}}"
                        hx-target="#product-row-{{.ID}}"
                        hx-swap="outerHTML"
                        hx-confirm="Are you sure you want to delete this product?"
                    >
                        Delete
                    </button>
                </td>
            </tr>
            {{end}}
        </tbody>
    </table>
</div>
{{end}}
