{{define "main"}}
<div class="bg-white">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div
            class="pt-12 pb-24 lg:grid lg:grid-cols-4 lg:gap-x-8 xl:grid-cols-5"
        >

        <aside>
            <h2 class="text-lg font-medium text-gray-900">Filters</h2>

            <!-- Master filter form with unified HTMX attributes -->
            <form id="filter-form"
                  class="mt-4 border-t border-gray-200"
                  hx-get="/"
                  hx-target="#product-list-container"
                  hx-push-url="true"
                  hx-indicator=".htmx-indicator"
                  hx-trigger="change, keyup changed delay:500ms from:input[type='search'], submit">

                <!-- Search Bar -->
                <div class="border-t border-gray-200 px-4 py-6">
                    <h3 class="flow-root"><label for="search-query" class="text-sm font-medium text-gray-900">Search</label></h3>
                    <div class="mt-4">
                        <label class="input">
                          <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <g
                              stroke-linejoin="round"
                              stroke-linecap="round"
                              stroke-width="2.5"
                              fill="none"
                              stroke="currentColor"
                            >
                              <circle cx="11" cy="11" r="8"></circle>
                              <path d="m21 21-4.3-4.3"></path>
                            </g>
                          </svg>
                          <input type="search" name="query" id="search-query" value="{{.Filters.Query}}" class="grow" placeholder="Search products" />

                        </label>
                    </div>
                </div>

                <!-- Sort Dropdown -->
                <div class="border-t border-gray-200 px-4 py-6">
                    <h3 class="flow-root"><label for="sort-by" class="text-sm font-medium text-gray-900">Sort by</label></h3>
                    <div class="mt-4">
                        <select id="sort-by" name="sort" class="select w-full">
                            <option value="date_desc" {{if or (eq .Filters.Sort "date_desc") (eq .Filters.Sort "")}}selected{{end}}>Newest</option>
                            <option value="price_asc" {{if eq .Filters.Sort "price_asc"}}selected{{end}}>Price: Low to High</option>
                            <option value="price_desc" {{if eq .Filters.Sort "price_desc"}}selected{{end}}>Price: High to Low</option>
                        </select>
                    </div>
                </div>

                <!-- Category Filter (as Radio Buttons) -->
                <div class="border-t border-gray-200 px-4 py-6">
                    <h3 class="flow-root"><span class="font-medium text-gray-900">Category</span></h3>
                    <div class="space-y-4 pt-6">
                        <!-- "All" option -->
                        <div class="flex items-center">
                            <input type="radio" id="category-all" name="category" class="radio radio-secondary radio-xs" value="" {{if eq .Filters.Category ""}}checked{{end}} />
                            <label for="category-all" class="ml-3 text-sm text-gray-600">All Categories</label>
                        </div>
                        <!-- Category options -->
                        {{range .Categories}}
                        <div class="flex items-center justify-between">
                            <div>
                                <input type="radio" id="category-{{.Name}}" name="category" class="radio radio-secondary radio-xs" value="{{.Name}}" {{if eq $.Filters.Category .Name}}checked{{end}} />
                                <label for="category-{{.Name}}" class="ml-3 text-sm text-gray-600">{{.Name}}</label>
                            </div>
                            <span class="ml-auto rounded bg-gray-100 px-2 text-xs font-medium text-gray-800">{{.ProductCount}}</span>
                        </div>
                        {{end}}
                    </div>
                </div>

                <!-- Price Filter -->
                <div class="border-t border-gray-200 px-4 py-6">
                    <h3 class="flow-root"><span class="font-medium text-gray-900">Price</span></h3>
                    <div class="space-y-4 pt-6">
                        <div class="flex items-center space-x-2">
                            <input type="number" name="min_price" placeholder="$0" value="{{if gt .Filters.MinPrice 0}}{{.Filters.MinPrice}}{{end}}" class="block w-full ...">
                            <span class="text-gray-500">-</span>
                            <input type="number" name="max_price" placeholder="$100+" value="{{if gt .Filters.MaxPrice 0}}{{.Filters.MaxPrice}}{{end}}" class="block w-full ...">
                        </div>
                        <button type="submit" class="w-full ...">Apply Price</button>
                    </div>
                </div>
            </form>
        </aside>

            <!-- Main grid area -->
            <main class="mt-6 lg:col-span-3 lg:mt-0 xl:col-span-4">
                <div class="flex justify-between items-center">
                    <h1 class="text-2xl font-bold">Products</h1>
                    <span class="htmx-indicator">Searching...</span>
                </div>
                <!-- This container will be replaced by HTMX -->
                <div id="product-list-container">
                    {{template "product_list.partial.html" .}}
                </div>

            </main>
        </div>
    </div>
</div>
{{end}}
