{{define "main"}} {{with .Form}}
<!-- Scope changes to the Form struct -->
<div class="max-w-4xl mx-auto" id="product-form-container">
    <h1 class="text-3xl font-bold mb-8">
        {{if .IsEdit}}Edit Product{{else}}Create New Product{{end}}
    </h1>

    <form
        class="space-y-6"
        {{if
        .IsEdit}}
        hx-post="/admin/products/edit/{{.ID}}"
        {{else}}
        hx-post="/admin/products/new"
        {{end}}
        hx-swap="outerHTML"
        hx-target="#product-form-container"
    >
        <label class="form-control w-full">
            <div class="label">
                <span class="label-text">Product Name</span>
            </div>
            <input
                type="text"
                name="name"
                value="{{.Name}}"
                placeholder="e.g., Go & HTMX T-Shirt"
                class="input input-bordered w-full {{if .Errors.Name}}input-error{{end}}"
            />
            {{with .Errors.Name}}
            <div class="label">
                <span class="label-text-alt text-error">{{.}}</span>
            </div>
            {{end}}
        </label>

        <label class="form-control">
            <div class="label"><span class="label-text">Description</span></div>
            <textarea
                name="description"
                class="textarea textarea-bordered h-24"
                placeholder="Product details..."
            >
{{.Description}}</textarea
            >
        </label>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <label class="form-control w-full">
                <div class="label">
                    <span class="label-text">Price (e.g., 29.99)</span>
                </div>
                <input
                    type="number"
                    step="0.01"
                    name="price"
                    value="{{if gt .Price 0.0}}{{.Price}}{{end}}"
                    placeholder="29.99"
                    class="input input-bordered w-full {{if .Errors.Price}}input-error{{end}}"
                />
                {{with .Errors.Price}}
                <div class="label">
                    <span class="label-text-alt text-error">{{.}}</span>
                </div>
                {{end}}
            </label>
            <label class="form-control w-full">
                <div class="label">
                    <span class="label-text">Base Stock</span>
                </div>
                <input
                    type="number"
                    name="stock"
                    value="{{.Stock}}"
                    placeholder="100"
                    class="input input-bordered w-full"
                />
            </label>
            <label class="form-control w-full">
                <div class="label">
                    <span class="label-text">Category</span>
                </div>
                <select name="category_id" class="select select-bordered">
                    <option
                        value="0"
                        {{if
                        not
                        .CategoryID.Valid}}selected{{end}}
                    >
                        Uncategorized
                    </option>
                    {{range $.AllCategories}}
                    <option
                        value="{{.ID}}"
                        {{if
                        and
                        $.Form.CategoryID.Valid
                        (eq
                        $.Form.CategoryID.Int64
                        .ID)}}selected{{end}}
                    >
                        {{.Name}}
                    </option>
                    {{end}}
                </select>
            </label>
        </div>

        <div
            x-data="imageUploader('{{.ImageURL | js}}')"
            class="form-control w-full"
        >
            <div class="label">
                <span class="label-text">Product Image</span>
            </div>
            <div
                x-show="!previewUrl"
                @dragover.prevent
                @drop.prevent="handleDrop"
                class="flex items-center justify-center w-full"
            >
                <label
                    for="dropzone-file"
                    class="flex flex-col items-center justify-center w-full h-64 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-base-200 hover:bg-base-300"
                >
                    <div
                        class="flex flex-col items-center justify-center pt-5 pb-6"
                    >
                        <p class="mb-2 text-sm text-gray-500">
                            <span class="font-semibold">Click to upload</span>
                            or drag and drop
                        </p>
                    </div>
                    <input
                        id="dropzone-file"
                        type="file"
                        @change="handleFileSelect"
                        class="hidden"
                        accept="image/*"
                    />
                </label>
            </div>
            <div x-show="previewUrl" class="relative">
                <img
                    :src="previewUrl"
                    class="w-full h-auto max-h-96 object-contain rounded-lg bg-gray-100"
                />
                <button
                    type="button"
                    @click="clearImage()"
                    class="btn btn-sm btn-circle absolute top-2 right-2"
                >
                    ✕
                </button>
            </div>
            <input type="hidden" name="image_url" :value="finalImageUrl" />
            <div x-show="uploading" class="text-sm text-info">Uploading...</div>
            <div x-show="error" x-text="error" class="text-sm text-error"></div>
        </div>

        <!-- DYNAMIC VARIANT EDITOR -->
        <div class="divider"></div>
        <div class="space-y-4" x-data="variantEditor('{{.VariantsJSON | js}}')">
            <h2 class="text-xl font-bold">Variants</h2>
            <input type="hidden" name="variants_json" :value="getFinalJSON()" />

            <div class="space-y-4">
                <template
                    x-for="(group, groupIndex) in variantData.variant_groups"
                    :key="groupIndex"
                >
                    <div class="p-4 bg-base-200 rounded-lg">
                        <div class="flex justify-between items-center">
                            <input
                                type="text"
                                x-model="group.name"
                                placeholder="Group Name (e.g., Size)"
                                class="input input-sm input-bordered font-bold"
                            />
                            <button
                                type="button"
                                @click="removeGroup(groupIndex)"
                                class="btn btn-sm btn-ghost text-error"
                            >
                                &times; Remove Group
                            </button>
                        </div>
                        <div class="pl-4 mt-2 space-y-2">
                            <template
                                x-for="(option, optionIndex) in group.options"
                                :key="optionIndex"
                            >
                                <div class="flex items-center gap-2">
                                    <input
                                        type="text"
                                        x-model="group.options[optionIndex]"
                                        @input.debounce.500ms="generateSKUs"
                                        placeholder="Option Value (e.g., Large)"
                                        class="input input-sm input-bordered grow"
                                    />
                                    <button
                                        type="button"
                                        @click="removeOption(groupIndex, optionIndex)"
                                        class="btn btn-xs btn-circle btn-ghost text-error"
                                    >
                                        ✕
                                    </button>
                                </div>
                            </template>
                            <button
                                type="button"
                                @click="addOption(groupIndex)"
                                class="btn btn-xs btn-outline mt-2"
                            >
                                Add Option
                            </button>
                        </div>
                    </div>
                </template>
            </div>
            <button
                type="button"
                @click="addGroup()"
                class="btn btn-sm btn-outline"
            >
                Add Variant Group
            </button>
            <button
                type="button"
                @click="generateSKUs()"
                class="btn btn-sm btn-accent ml-4"
                :disabled="variantData.variant_groups.length === 0"
            >
                Generate/Update SKUs
            </button>

            <!-- SKUs Table -->
            <div
                class="mt-6"
                x-show="variantData.skus && variantData.skus.length > 0"
            >
                <h3 class="font-bold">Generated SKUs (Stock Keeping Units)</h3>
                <div class="overflow-x-auto">
                    <table class="table table-sm mt-2">
                        <thead>
                            <tr>
                                <th>Combination</th>
                                <th>Price Modifier ($)</th>
                                <th>Stock</th>
                                <th>Image URL</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template
                                x-for="(sku, skuIndex) in variantData.skus"
                                :key="skuIndex"
                            >
                                <tr>
                                    <td
                                        x-text="Object.values(sku.attributes).join(' / ')"
                                    ></td>
                                    <td>
                                        <input
                                            type="number"
                                            step="0.01"
                                            x-model.number="sku.priceModifier"
                                            @input="sku.priceModifier = $event.target.value * 100"
                                            :value="sku.priceModifier / 100"
                                            class="input input-xs w-24"
                                        />
                                    </td>
                                    <td>
                                        <input
                                            type="number"
                                            x-model.number="sku.stock"
                                            class="input input-xs w-24"
                                        />
                                    </td>
                                    <td>
                                        <input
                                            type="text"
                                            x-model="sku.image"
                                            class="input input-xs w-full"
                                            placeholder="Optional variant-specific image URL"
                                        />
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
            {{with .Errors.VariantsJSON}}
            <p class="text-red-500 text-xs mt-1">{{.}}</p>
            {{end}}
        </div>

        <div class="pt-4 flex justify-end gap-4">
            <a href="/admin/products" class="btn">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Product</button>
        </div>
    </form>
</div>
{{end}}
<!-- This closes 'with .Form' -->
{{end}}
<!-- This closes 'define "main"' -->
