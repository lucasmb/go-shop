{{define "main"}}
<div class="mx-auto max-w-lg">
    <h1 class="text-2xl font-bold tracking-tight text-gray-900">Checkout</h1>
    <p class="mt-2 text-sm text-gray-600">
        Your order total is
        <span class="font-medium text-gray-900"
            >{{formatPrice .Cart.Total}}</span
        >.
    </p>

    <div class="mt-8 space-y-4">
        <button id="pay-stripe" class="w-full btn btn-secondary">
            Pay with Stripe
        </button>
        <button id="pay-mercado-pago" class="w-full btn btn-secondary">
            Pay with Mercado Pago
        </button>
        <!-- BANK DEPOSIT FORM -->
        <form
            id="bank-deposit-form"
            action="/checkout/bank-deposit"
            method="POST"
        >
            <input
                type="hidden"
                name="idempotency_key"
                value="{{.IdempotencyKey}}"
            />
            <button type="submit" class="w-full rounded-md bg-gray-600 ...">
                Pay with Bank Deposit
            </button>
        </form>
    </div>
    <div id="mercado-pago-container" class="mt-4"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Get the single, stable key provided by the server
        const idempotencyKey = "{{.IdempotencyKey}}";

        const stripeButton = document.getElementById("pay-stripe");
        if (stripeButton) {
            const stripe = Stripe("{{.StripePubKey}}");
            stripeButton.addEventListener("click", function () {
                fetch("/checkout/create-payment-intent", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        provider: "stripe",
                        idempotency_key: idempotencyKey,
                    }),
                })
                    .then((response) => response.json())
                    .then((session) => {
                        return stripe.redirectToCheckout({
                            sessionId: session.id,
                        });
                    })
                    .then((result) => {
                        if (result.error) {
                            alert(result.error.message);
                        }
                    })
                    .catch((error) => {
                        console.error("Error:", error);
                    });
            });
        }

        // Mercado Pago
        const mp = new MercadoPago("YOUR_MERCADO_PAGO_PUBLIC_KEY", {
            locale: "en-US",
        }); // Use your public key
        const payMPButton = document.getElementById("pay-mercado-pago");

        payMPButton.addEventListener("click", function () {
            payMPButton.disabled = true;
            fetch("/checkout/create-payment-intent", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ provider: "mercadopago" }),
            })
                .then((response) => response.json())
                .then((preference) => {
                    // Renders the payment brick
                    mp.bricks().create("wallet", "mercado-pago-container", {
                        initialization: {
                            preferenceId: preference.id,
                        },
                    });
                })
                .catch((error) => {
                    console.error("Error:", error);
                    payMPButton.disabled = false;
                });
        });
    });
</script>
{{end}}
