{{define "toast.partial.html"}}

<div
    hx-swap-oob="beforeend:#toast-container"
    x-data
    x-init="setTimeout(() => $el.remove(), 4000)"
    class="pointer-events-auto w-full max-w-sm overflow-hidden rounded-lg bg-white shadow-lg ring-1 ring-black ring-opacity-5 transition-opacity duration-500"
>
    <div class="p-4">
        <div class="flex items-start">
            <div class="flex-shrink-0">
                {{if eq .type "error"}}
                <svg
                    class="h-6 w-6 text-red-400"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"
                    />
                </svg>
                {{else}}
                <svg
                    class="h-6 w-6 text-green-400"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                    />
                </svg>
                {{end}}
            </div>
            <div class="ml-3 w-0 flex-1 pt-0.5">
                <p class="text-sm font-medium text-gray-900">
                    {{if eq .type "error"}}Error{{else}}Success!{{end}}
                </p>
                <p class="mt-1 text-sm text-gray-500">{{.Flash}}</p>
            </div>
        </div>
    </div>
</div>
{{end}}
